stages:
  - build

variables:
  # Image de registre cible
  REGISTRY_HOST: "registry.hermes.lan"
  IMAGE_NAME: "hermes-api"
  # Active Docker BuildKit pour le support des --secret
  DOCKER_BUILDKIT: "1"

build_and_push:
  stage: build
  image: registry.hermes.lan/docker:27-cli
  before_script:
    - docker version
    - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
  script:
    # 1. Nettoyage de tout ancien builder résiduel sur l'hôte
    - docker rm -f buildx_buildkit_hermes-builder0 2>/dev/null || true
    - docker buildx rm hermes-builder 2>/dev/null || true

    # 2. Détection dynamique du réseau Docker du runner (portabilité en entreprise)
    - |
      CONTAINER_ID=$(grep -m 1 -oE "[0-9a-f]{64}" /proc/self/mountinfo || true)
      [ -z "$CONTAINER_ID" ] && CONTAINER_ID=$(hostname)
      NETWORK_NAME=$(docker inspect "$CONTAINER_ID" --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{break}}{{end}}' 2>/dev/null || true)
      NETWORK_OPT=""
      if [ -n "$NETWORK_NAME" ] && [ "$NETWORK_NAME" != "bridge" ] && [ "$NETWORK_NAME" != "host" ]; then
        echo "🌐 Réseau Docker détecté : $NETWORK_NAME"
        NETWORK_OPT="--driver-opt network=${NETWORK_NAME}"
      else
        echo "🌐 Réseau standard / par défaut"
      fi

    # 3. Préparation du fichier buildkitd.toml avec le certificat CA
    # - |
    #   mkdir -p /tmp/buildkit
    #   cat "$CA_CERTIFICATE" > /tmp/buildkit/ca.crt
    #   cat <<EOF > /tmp/buildkit/buildkitd.toml
    #   [registry."${REGISTRY_HOST}"]
    #     ca = ["/tmp/buildkit/ca.crt"]
    #   EOF

    # 4. Création et démarrage du custom builder officiel avec le driver docker-container
    - |
      docker buildx create \
        --name hermes-builder \
        --driver docker-container \
        --driver-opt image=registry.hermes.lan/moby/buildkit:buildx-stable-1 \
        --buildkitd-config /tmp/buildkit/buildkitd.toml \
        --use \
        --bootstrap
    # - |
    #   docker buildx create \
    #     --name hermes-builder \
    #     --driver docker-container \
    #     --driver-opt image=registry.hermes.lan/moby/buildkit:buildx-stable-1 \
    #     $NETWORK_OPT \
    #     --buildkitd-config /tmp/buildkit/buildkitd.toml \
    #     --use \
    #     --bootstrap

    # 5. Authentification Docker au registre (Buildx hérite des identifiants créés dans la session courante)
    - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin

    # 6. Build et Push via le custom builder
    - |
      docker buildx build \
        --builder hermes-builder \
        --secret id=ca_cert,src="$CA_CERTIFICATE" \
        --secret id=gitlab_token,env=CI_JOB_TOKEN \
        --file Dockerfile.prod \
        --tag "${REGISTRY_HOST}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" \
        --tag "${REGISTRY_HOST}/${IMAGE_NAME}:latest" \
        --push \
        .
    - echo "🎉 Image déployée avec succès sur https://${REGISTRY_HOST}"

  after_script:
    - docker rm -f buildx_buildkit_hermes-builder0 2>/dev/null || true
    - docker buildx rm hermes-builder 2>/dev/null || true

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
