[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-api"
version = "0.1.0"
description = "FastAPI POC consommant hermes-math"
authors = [{ name = "Florent" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    # Dépendance Git vers GitLab hermes.lan :
    # Note: En prod/build Docker, pip clone cette URL (avec token si repo privé).
    "hermes-math @ git+https://gitlab.hermes.lan/root/hermes-math.git@0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

